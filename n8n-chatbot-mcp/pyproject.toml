[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-chatbot-mcp"
version = "1.0.0"
description = "Generic n8n Chat Trigger MCP server - any n8n chatbot as an MCP tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mytsx"}
]
keywords = ["mcp", "model-context-protocol", "chatbot", "n8n", "webhook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/mytsx/mcp-servers"
Repository = "https://github.com/mytsx/mcp-servers"
Issues = "https://github.com/mytsx/mcp-servers/issues"

[project.scripts]
n8n-chatbot-mcp = "n8n_chatbot_mcp.__main__:run"

[tool.setuptools]
packages = ["n8n_chatbot_mcp"]
package-dir = {"" = "src"}
