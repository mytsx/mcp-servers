[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-ssh"
version = "2.0.0"
description = "SSH MCP server for remote Linux command execution via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mytsx"}
]
keywords = ["mcp", "model-context-protocol", "ssh", "remote", "linux", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp[cli]>=2.2,<3",
    "anyio>=4.5",
    "paramiko>=3.4.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mytsx/mcp-servers"
Repository = "https://github.com/mytsx/mcp-servers"
Issues = "https://github.com/mytsx/mcp-servers/issues"

[project.scripts]
mcp-server-ssh = "mcp_server_ssh.__main__:run"

[tool.setuptools]
packages = ["mcp_server_ssh"]
package-dir = {"" = "src"}
