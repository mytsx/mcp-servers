[project]
name = "mcp-server-git-extended"
version = "1.0.0"
description = "An extended Model Context Protocol server providing comprehensive Git functionality including cherry-pick, reset modes, merge, rebase, push/pull, stash, and tag operations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anthropic, PBC." }, { name = "Extended by Mehmet Yerli" }]
maintainers = [{ name = "Mehmet Yerli", email = "mehmet.yerli@mapeg.gov.tr" }]
keywords = ["git", "mcp", "llm", "automation", "cherry-pick", "rebase", "stash"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "click>=8.1.7",
    "gitpython>=3.1.43",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlmodel>=0.0.14",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
mcp-server-git-extended = "mcp_server_git:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_git"]

[tool.uv]
dev-dependencies = ["pyright>=1.1.389", "ruff>=0.7.3", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
