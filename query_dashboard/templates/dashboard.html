<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Query Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">
                <i class="fas fa-database mr-2"></i>
                MCP Query Dashboard
            </h1>
            <div class="flex items-center space-x-4">
                <a href="/" class="hover:text-blue-200 font-medium">Dashboard</a>
                <a href="/logs" class="hover:text-blue-200">Query Logs</a>
                <div class="flex items-center space-x-2 text-sm">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <span>Auto-refresh: 1s</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="bg-blue-500 text-white p-3 rounded-lg">
                        <i class="fas fa-search text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">Total Queries</p>
                        <p class="text-2xl font-bold" id="total-queries">-</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="bg-green-500 text-white p-3 rounded-lg">
                        <i class="fas fa-check-circle text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">Success Rate</p>
                        <p class="text-2xl font-bold" id="success-rate">-</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="bg-yellow-500 text-white p-3 rounded-lg">
                        <i class="fas fa-clock text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">Avg Time</p>
                        <p class="text-2xl font-bold" id="avg-time">-</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="bg-purple-500 text-white p-3 rounded-lg">
                        <i class="fas fa-server text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 text-sm">Active Servers</p>
                        <p class="text-2xl font-bold" id="active-servers">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Activity Row -->
        <div class="grid grid-cols-1 gap-6 mb-8">
            <!-- Recent Activity -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold mb-4">
                    <i class="fas fa-clock mr-2 text-green-600"></i>
                    Recent Activity
                </h3>
                <div id="recent-activity" class="space-y-3 max-h-96 overflow-y-auto">
                    <!-- Activity items will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Recent Errors -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-semibold mb-4">
                <i class="fas fa-exclamation-triangle mr-2 text-red-600"></i>
                Recent Errors
            </h3>
            <div id="recent-errors" class="space-y-2">
                <!-- Error items will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Query Detail Modal -->
    <div id="query-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-6xl w-full max-h-screen overflow-y-auto">
                <div class="px-6 py-4 bg-gray-50 border-b flex justify-between items-center">
                    <h3 class="text-lg font-semibold">Query Details</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="modal-content" class="p-6">
                    <!-- Modal content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-refresh interval (5 seconds)
        let refreshInterval = null;

        // Load initial dashboard data
        async function loadDashboardData() {
            try {
                const [statsResponse, logsResponse] = await Promise.all([
                    fetch('/api/stats'),
                    fetch('/api/logs?limit=10')
                ]);

                const stats = await statsResponse.json();
                const recentLogs = await logsResponse.json();

                updateStatsCards(stats);
                updateRecentActivity(recentLogs);
                updateRecentErrors(stats.recent_errors || []);

            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        // Auto-refresh function
        function startAutoRefresh() {
            // Clear existing interval
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            
            // Set new interval for 1 second
            refreshInterval = setInterval(() => {
                loadDashboardData();
                console.log('Dashboard refreshed');
            }, 1000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function updateStatsCards(stats) {
            document.getElementById('total-queries').textContent = stats.total_queries || 0;
            document.getElementById('success-rate').textContent = (stats.success_rate || 0) + '%';
            document.getElementById('avg-time').textContent = (stats.avg_execution_time_ms || 0) + 'ms';
            document.getElementById('active-servers').textContent = Object.keys(stats.queries_by_server || {}).length;
        }

        function updateRecentActivity(logs) {
            const container = document.getElementById('recent-activity');
            container.innerHTML = '';

            if (logs.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center">No recent activity</p>';
                return;
            }

            logs.forEach(log => {
                const statusIcon = log.status === 'success' ? 
                    '<i class="fas fa-check-circle text-green-500"></i>' : 
                    '<i class="fas fa-times-circle text-red-500"></i>';
                
                const timeAgo = getTimeAgo(log.timestamp);
                const serverBadge = getServerBadge(log.server_type);

                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-gray-50 rounded cursor-pointer hover:bg-gray-100 transition-colors';
                item.onclick = () => showQueryDetail(log);
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        ${statusIcon}
                        <div>
                            <p class="font-medium text-sm">${log.tool_name}</p>
                            <p class="text-xs text-gray-600 font-mono bg-gray-50 p-1 rounded">${log.query_text}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        ${serverBadge}
                        <p class="text-xs text-gray-500">${timeAgo}</p>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateRecentErrors(errors) {
            const container = document.getElementById('recent-errors');
            container.innerHTML = '';

            if (errors.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No recent errors</p>';
                return;
            }

            errors.forEach(error => {
                const timeAgo = getTimeAgo(error.timestamp);
                const serverBadge = getServerBadge(error.server_type);

                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-red-50 border border-red-200 rounded';
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-exclamation-triangle text-red-500"></i>
                        <div>
                            <p class="text-sm font-medium text-red-800">${truncateText(error.error_message, 80)}</p>
                            <p class="text-xs text-red-600">${timeAgo}</p>
                        </div>
                    </div>
                    <div>
                        ${serverBadge}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function getServerBadge(serverType) {
            const colors = {
                'postgresql': 'bg-blue-100 text-blue-800',
                'oracle': 'bg-red-100 text-red-800'
            };
            const color = colors[serverType] || 'bg-gray-100 text-gray-800';
            return `<span class="px-2 py-1 text-xs font-medium rounded ${color}">${serverType.toUpperCase()}</span>`;
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            const time = new Date(timestamp);
            const diffMs = now - time;
            const diffMins = Math.floor(diffMs / 60000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffMins < 1440) return `${Math.floor(diffMins / 60)}h ago`;
            return `${Math.floor(diffMins / 1440)}d ago`;
        }

        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        function showQueryDetail(log) {
            const modalContent = document.getElementById('modal-content');
            const statusBadge = getStatusBadge(log.status);
            const serverBadge = getServerBadge(log.server_type);
            const time = new Date(log.timestamp).toLocaleString('tr-TR');

            modalContent.innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Server</label>
                            <div class="mt-1">${serverBadge}</div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tool</label>
                            <p class="mt-1 text-sm">${log.tool_name}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Status</label>
                            <div class="mt-1">${statusBadge}</div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Time</label>
                            <p class="mt-1 text-sm">${time}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Execution Time</label>
                            <p class="mt-1 text-sm">${log.execution_time_ms.toFixed(2)} ms</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Row Count</label>
                            <p class="mt-1 text-sm">${log.row_count} rows</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Log ID</label>
                            <p class="mt-1 text-sm">#${log.id}</p>
                        </div>
                    </div>

                    ${log.user_query ? `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">User Query</label>
                        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                            <pre class="text-sm text-blue-800 whitespace-pre-wrap">${log.user_query}</pre>
                        </div>
                    </div>
                    ` : ''}

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">SQL Query</label>
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
                            <pre class="text-sm text-gray-800 whitespace-pre-wrap overflow-x-auto">${log.query_text}</pre>
                        </div>
                    </div>

                    ${log.error_message ? `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Error Message</label>
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                            <pre class="text-sm text-red-800 whitespace-pre-wrap">${log.error_message}</pre>
                        </div>
                    </div>
                    ` : ''}

                    ${log.response_text && log.response_text.trim() ? `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Query Results</label>
                        <div class="bg-green-50 border border-green-200 rounded-lg p-4 max-h-screen overflow-y-auto">
                            ${formatAsTable(log.response_text)}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;

            document.getElementById('query-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('query-modal').classList.add('hidden');
        }

        function getStatusBadge(status) {
            if (status === 'success') {
                return '<span class="px-2 py-1 text-xs font-medium bg-green-100 text-green-800 rounded-full">Success</span>';
            } else {
                return '<span class="px-2 py-1 text-xs font-medium bg-red-100 text-red-800 rounded-full">Error</span>';
            }
        }

        function formatAsTable(responseText) {
            const lines = responseText.split('\n');
            let headerLine = '';
            let dataLines = [];
            let inTable = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Skip header lines with query info
                if (line.includes('🔍') || line.includes('📊') || line.includes('===')) {
                    continue;
                }
                
                // Found table header (line with |)
                if (line.includes(' | ') && !headerLine && !line.includes('----')) {
                    headerLine = line.trim();
                    inTable = true;
                    continue;
                }
                
                // Skip separator line
                if (line.includes('----')) {
                    continue;
                }
                
                // Collect data rows
                if (inTable && line.includes(' | ') && line.trim()) {
                    dataLines.push(line.trim());
                }
            }
            
            // If we found a table, format it as HTML
            if (headerLine && dataLines.length > 0) {
                const headers = headerLine.split(' | ').map(h => h.trim());
                
                let tableHtml = '<div class="overflow-x-auto"><table class="min-w-full text-xs border-collapse">';
                
                // Table header
                tableHtml += '<thead class="bg-green-100"><tr>';
                headers.forEach(header => {
                    tableHtml += `<th class="border border-green-300 px-2 py-1 text-left font-semibold">${header}</th>`;
                });
                tableHtml += '</tr></thead>';
                
                // Table body
                tableHtml += '<tbody>';
                dataLines.forEach((line, index) => {
                    const cells = line.split(' | ').map(c => c.trim());
                    const expectedCols = headers.length;
                    const rowClass = index % 2 === 0 ? 'bg-white' : 'bg-green-25';
                    
                    tableHtml += `<tr class="${rowClass}">`;
                    
                    // Fill cells
                    for (let i = 0; i < expectedCols; i++) {
                        let cellContent = cells[i] || '';
                        tableHtml += `<td class="border border-green-200 px-2 py-1">${cellContent}</td>`;
                    }
                    
                    tableHtml += '</tr>';
                });
                tableHtml += '</tbody></table></div>';
                
                return tableHtml;
            }
            
            // Fallback to pre-formatted text
            return `<pre class="text-xs font-mono text-green-800 whitespace-pre-wrap overflow-x-auto">${responseText}</pre>`;
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
            startAutoRefresh();
            
            // Stop refresh when page is hidden, start when visible
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    stopAutoRefresh();
                } else {
                    startAutoRefresh();
                }
            });

            // Close modal on ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            // Close modal on background click
            document.getElementById('query-modal').addEventListener('click', function(e) {
                // Close if clicked on backdrop (not inside modal content)
                const modalContent = e.target.closest('.bg-white.rounded-lg');
                if (!modalContent) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
