[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-reviews-mcp"
version = "2.0.0"
description = "Gemini PR Reviews MCP server - Fetch Gemini Code Assist reviews from GitHub PRs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mytsx"}
]
keywords = ["mcp", "model-context-protocol", "github", "gemini", "pr-reviews", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp[cli]>=2.2,<3",
    "httpx2>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mytsx/mcp-servers"
Repository = "https://github.com/mytsx/mcp-servers"
Issues = "https://github.com/mytsx/mcp-servers/issues"

[project.scripts]
gemini-reviews-mcp = "gemini_reviews_mcp.__main__:run"

[tool.setuptools]
packages = ["gemini_reviews_mcp"]
package-dir = {"" = "src"}
