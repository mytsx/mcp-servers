[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gemini-pr-reviews"
version = "1.0.0"
description = "Gemini PR Reviews MCP server - Fetch Gemini Code Assist reviews from GitHub PRs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "github", "gemini", "pr-reviews", "claude"]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-gemini-pr-reviews = "mcp_gemini_pr_reviews.__main__:run"

[tool.setuptools]
packages = ["mcp_gemini_pr_reviews"]
package-dir = {"" = "src"}
